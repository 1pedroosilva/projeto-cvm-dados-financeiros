# Job Testes de Integração - Pipeline CVM
# Propósito: Validação E2E (Bronze → Silver) em schemas isolados
# Escopo: Pipelines DRE, BPA e BPP completos para ano 2021 (volume minimo, execucao rapida)
# Estratégia: Fail-fast via depends_on - falha em teste bloqueia próximos

resources:
  jobs:
    testes_integracao_cvm:
      name: "[test] Testes de Integração - Pipeline CVM"

      # Configurações gerais do job
      max_concurrent_runs: 1
      timeout_seconds: 1800  # 30 minutos (testes são rápidos)

      # Notificações
      email_notifications:
        on_failure:
          - ${var.notification_email}
        # Não notificar em sucesso (job de teste roda frequentemente)

      # Sem schedule - disparado via GitHub Actions ou manualmente
      # schedule:
      #   quartz_cron_expression: "0 0 2 * * ?"
      #   timezone_id: "America/Sao_Paulo"
      #   pause_status: PAUSED

      # Tasks do pipeline de testes
      tasks:
        # TASK 1: Criar schemas de teste
        - task_key: criar_schemas_teste
          notebook_task:
            notebook_path: ../../05_apoio/001_ddl_create_tables.py
            base_parameters:
              AMBIENTE: ${bundle.target}

        # TASK 2: Ingestao Bronze DRE para ano 2021
        - task_key: test_bronze_dre_2021
          depends_on:
            - task_key: criar_schemas_teste
          notebook_task:
            notebook_path: ../../01_bronze/101_cvm_dfp_dre.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 3: Transformacao Silver DRE para ano 2021
        - task_key: test_silver_dre_2021
          depends_on:
            - task_key: test_bronze_dre_2021
          notebook_task:
            notebook_path: ../../02_silver/201_cvm_dfp_dre.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 4: Validacoes de integracao DRE (contagens, PKs, metadados)
        - task_key: validacoes_integracao_dre
          depends_on:
            - task_key: test_silver_dre_2021
          notebook_task:
            notebook_path: ../../06_testes/test_integracao_dre.py
            base_parameters:
              AMBIENTE: ${bundle.target}

        # TASK 5: Ingestao Bronze BPA para ano 2021
        - task_key: test_bronze_bpa_2021
          depends_on:
            - task_key: validacoes_integracao_dre
          notebook_task:
            notebook_path: ../../01_bronze/102_cvm_dfp_bpa.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 6: Transformacao Silver BPA para ano 2021
        - task_key: test_silver_bpa_2021
          depends_on:
            - task_key: test_bronze_bpa_2021
          notebook_task:
            notebook_path: ../../02_silver/202_cvm_dfp_bpa.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 7: Validacoes de integracao BPA (contagens, PKs, metadados)
        - task_key: validacoes_integracao_bpa
          depends_on:
            - task_key: test_silver_bpa_2021
          notebook_task:
            notebook_path: ../../06_testes/test_integracao_bpa.py
            base_parameters:
              AMBIENTE: ${bundle.target}

        # TASK 8: Ingestao Bronze BPP para ano 2021
        - task_key: test_bronze_bpp_2021
          depends_on:
            - task_key: validacoes_integracao_bpa
          notebook_task:
            notebook_path: ../../01_bronze/103_cvm_dfp_bpp.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 9: Transformacao Silver BPP para ano 2021
        - task_key: test_silver_bpp_2021
          depends_on:
            - task_key: test_bronze_bpp_2021
          notebook_task:
            notebook_path: ../../02_silver/203_cvm_dfp_bpp.py
            base_parameters:
              AMBIENTE: ${bundle.target}
              ANOS_OVERRIDE: "2021"

        # TASK 10: Validacoes de integracao BPP (contagens, PKs, metadados)
        - task_key: validacoes_integracao_bpp
          depends_on:
            - task_key: test_silver_bpp_2021
          notebook_task:
            notebook_path: ../../06_testes/test_integracao_bpp.py
            base_parameters:
              AMBIENTE: ${bundle.target}

        # TASK 11: Limpar schemas de teste (COMENTADO - manter dados para debug)
        # Descomente quando testes estiverem estáveis e você não precisar mais
        # inspecionar os dados após falhas
        #
        # - task_key: limpar_schemas_teste
        #   depends_on:
        #     - task_key: validacoes_integracao_bpp
        #   run_if: ALL_DONE  # Roda sempre, mesmo se testes falharem
        #   notebook_task:
        #     notebook_path: ../../06_testes/cleanup_schemas_teste.py
        #     base_parameters: {}
        #   environment_key: test_env

      # Tags para organização
      tags:
        projeto: cvm-dados-financeiros
        tipo: testes-integracao
        ambiente: ${bundle.target}
