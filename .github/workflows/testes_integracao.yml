# GitHub Actions Workflow - Testes de Integração Pipeline CVM
# Dispara o job de testes no Databricks e aguarda o resultado.
# Alimenta o badge de status do README.

name: Testes de Integração

# Trigger apenas manual - não consome DBU a cada push
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente (dev/ci)'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - dev

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  testes-integracao:
    runs-on: ubuntu-latest
    name: Executar Testes de Integração

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Databricks CLI
        uses: databricks/setup-cli@main

      # Atualiza o job no workspace com a última versão do código
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target ${{ inputs.ambiente }}

      # run-now já aguarda o job terminar e falha se o resultado não for SUCCESS.
      # O ID é posicional: a flag --job-id não existe na CLI atual.
      - name: Rodar testes de integração no Databricks
        run: databricks jobs run-now 176285066429591 --timeout 30m