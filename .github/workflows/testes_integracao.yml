# GitHub Actions Workflow - Testes de Integracao Pipeline CVM
# Dispara o job de testes no Databricks e aguarda o resultado.
# Alimenta o badge de status do README.

name: Testes de Integração

# Trigger apenas manual - nao consome DBU a cada push
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente (dev/ci)'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - dev

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  testes-integracao:
    runs-on: ubuntu-latest
    name: Executar Testes de Integração

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Databricks CLI
        uses: databricks/setup-cli@main

      # Sobe a definicao do YAML para o workspace
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target ${{ inputs.ambiente }}

      # Dispara o job gerenciado pelo bundle, pela chave declarada em
      # resources/jobs/job_testes_integracao.yml. Nunca por ID fixo:
      # ID fixo aponta para um job solto no workspace, nao para o que
      # o deploy acabou de atualizar.
      - name: Rodar testes de integração no Databricks
        run: databricks bundle run testes_integracao_cvm --target ${{ inputs.ambiente }}