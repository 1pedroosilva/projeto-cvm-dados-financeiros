# Databricks Asset Bundle - Projeto CVM Dados Financeiros
# Pipeline de ingestão e transformação de demonstrações financeiras da CVM
# Arquitetura: Bronze -> Silver -> Gold

bundle:
  name: projeto-cvm-dados-financeiros

include:
  - resources/**/*.yml

variables:
  # Workspace
  workspace_host:
    description: "URL do workspace Databricks"
    default: https://dbc-a4218100-86c9.cloud.databricks.com
  
  # Catálogo Unity Catalog
  catalog:
    description: "Catálogo Unity Catalog para as tabelas do projeto"
    default: workspace
  
  # Schema base do projeto
  schema_prefix:
    description: "Prefixo dos schemas (será concatenado com camada: bronze, silver, gold)"
    default: proj_cvm
  
  # Volume Landing Zone
  volume_landing:
    description: "Caminho do volume UC para Landing Zone"
    default: /Volumes/workspace/proj_cvm/landing
  
  # Notificações (independente de run_as)
  notification_email:
    description: "Email para notificações de falha no pipeline"
    default: 1pedro.osilva@gmail.com

targets:
  # Ambiente de desenvolvimento
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}
    variables:
      catalog: workspace
      schema_prefix: proj_cvm_dev
  
  # Ambiente de produção
  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
    variables:
      catalog: workspace
      schema_prefix: proj_cvm
    # Validações obrigatórias para produção
    run_as:
      # Em produção, especificar service principal
      # user_name: service-principal@databricks.com
      user_name: 1pedro.osilva@gmail.com
  
  # Ambiente de CI/CD
  ci:
    mode: development
    workspace:
      host: ${var.workspace_host}
    variables:
      catalog: workspace
      schema_prefix: proj_cvm_ci
    run_as:
      user_name: 1pedro.osilva@gmail.com
