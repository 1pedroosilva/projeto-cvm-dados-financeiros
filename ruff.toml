# Configuracao do ruff (corretor de codigo).
#
# Por enquanto o corretor olha apenas o codigo Python comum do projeto.
# Os notebooks Databricks ficam de fora ate serem revisados um a um.

include = ["tests/**/*.py", "05_apoio/config_parametros.py"]

line-length = 100
builtins = ["dbutils"]

[lint]
select = ["E", "F", "W", "I", "DTZ"]

[lint.per-file-ignores]
# Notebooks Databricks nao terminam com quebra de linha: a plataforma
# remove ao serializar. Corrigir na mao so duraria ate o proximo save.
"05_apoio/config_parametros.py" = ["W292"]

# Arquivos de teste editados pelo editor do Databricks sofrem do mesmo:
# a plataforma remove a quebra final e deixa espacos na linha em branco.
"tests/*.py" = ["W292", "W293"]